<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="把当前走势叠到历史上最像的一段上，并查看此后怎么走。历史统计不是预测。">
  <title>相似图形图库</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="example-banner" class="example-banner" hidden>示例数据，非真实行情</div>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="相似图形图库首页">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3 23 L9 14 L13 17.5 L18 8 L24 13 L29 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 21 L9 13 L13 16.5 L18 7 L24 12 L29 9" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      </svg>
      <span class="brand-text">
        <strong>相似图形图库</strong>
        <small>Pattern Atlas</small>
      </span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="#/" data-nav="home">当前走势</a>
      <a href="#/resemble" data-nav="resemble">最像哪类</a>
      <a href="#/catalog" data-nav="catalog">形态分类</a>
    </nav>
  </header>
  <main id="app" class="app">
    <div class="loading-block">
      <p class="loading">正在载入图库…</p>
      <div class="chart-box home"><div class="chart-skel"></div></div>
    </div>
  </main>
  <footer class="foot">
    <p class="disclaimer">历史此后走势与涨跌比例只是对过去样本的统计，<strong>不是预测</strong>。不构成投资建议，本工具也不会下单。</p>
  </footer>
  <script src="./vendor/lightweight-charts.min.js"></script>
  <script src="./js/schema.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
